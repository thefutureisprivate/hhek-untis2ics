[package]
name = "hhek-untis2ics"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false
license = "Apache-2.0"
repository = "https://github.com/thefutureisprivate/hhek-untis2ics"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
jiff = { version = "1.0", default-features = false, features = ["std", "tzdb-zoneinfo"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal"] }
totp-rs = { version = "6.0", default-features = false, features = ["std", "zeroize"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
