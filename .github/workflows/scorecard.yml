name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # Upload Scorecard's SARIF to GitHub code scanning.
      id-token: write # Authenticate public result publication to the Scorecard API.
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Run Scorecard
        uses: ossf/scorecard-action@v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload code scanning results
        uses: github/codeql-action/upload-sarif@v4.39.3
        with:
          sarif_file: results.sarif
          category: scorecard
